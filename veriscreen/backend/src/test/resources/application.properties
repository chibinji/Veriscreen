spring.application.name=veriscreen-backend
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/veriscreen_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=YourSuperSecretKeyAtLeast32CharactersLongChangeMe
jwt.expiration=86400000

veriscreen.university.name=University of Zambia
veriscreen.public-base-url=http://localhost:8081
veriscreen.documents.storage-dir=generated-documents
veriscreen.documents.logo-classpath=static/images/university-logo.png

# Keep tests on local seed data even if SIS/HELSB are running.
veriscreen.sis.base-url=http://127.0.0.1:9
veriscreen.sis.api-key=sis-dev-api-key-change-me
veriscreen.helsb.base-url=http://127.0.0.1:9
veriscreen.helsb.api-key=helsb-dev-api-key-change-me
veriscreen.helsb.callback-api-key=veriscreen-helsb-callback-change-me
university.sync.enabled=false

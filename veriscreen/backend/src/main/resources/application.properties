spring.application.name=veriscreen-backend

# HTTP (8080 is Apache on this machine; Vite proxies /api here)
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/veriscreen_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (update, not create-drop — test/restart shutdowns must not drop tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (change secret to a long random string)
jwt.secret=${JWT_SECRET:YourSuperSecretKeyAtLeast32CharactersLongChangeMe}
jwt.expiration=86400000

# OpenAPI / Swagger UI (API-first documentation)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Official document generation
veriscreen.university.name=University of Zambia
veriscreen.public-base-url=http://localhost:8081
veriscreen.documents.storage-dir=generated-documents
veriscreen.documents.logo-classpath=static/images/university-logo.png

# Simulated student information system (authoritative academic data)
veriscreen.sis.base-url=${SIS_BASE_URL:http://localhost:8090}
veriscreen.sis.api-key=${SIS_API_KEY:dev-shared-secret}

# HELSB system
veriscreen.helsb.base-url=${HELSB_BASE_URL:http://localhost:8083}
veriscreen.helsb.api-key=${HELSB_API_KEY:helsb-dev-api-key-change-me}
veriscreen.helsb.callback-api-key=${VERISCREEN_HELSB_CALLBACK_KEY:veriscreen-helsb-callback-change-me}

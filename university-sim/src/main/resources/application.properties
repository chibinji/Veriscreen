spring.application.name=university-sim

server.port=8090

# Permanent PostgreSQL database (survives restarts)
spring.datasource.url=jdbc:postgresql://localhost:5432/university_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# update = create missing tables, keep existing data (do not use create-drop in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Shared with VeriScreen (header: X-Api-Key)
sis.api-key=dev-shared-secret

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

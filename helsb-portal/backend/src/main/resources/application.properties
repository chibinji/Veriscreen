spring.application.name=helsb-portal
server.port=${HELSB_PORT:8083}

spring.datasource.url=${HELSB_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helsb_db}
spring.datasource.username=${HELSB_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${HELSB_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${HELSB_JWT_SECRET:HelsbSuperSecretKeyAtLeast32CharactersLongChangeMe}
jwt.expiration=${HELSB_JWT_EXPIRATION:86400000}

helsb.inbound-api-key=${HELSB_API_KEY:helsb-dev-api-key-change-me}
veriscreen.callback-url=${VERISCREEN_CALLBACK_URL:http://localhost:8081/api/v1/internal/helsb/decisions}
veriscreen.callback-api-key=${VERISCREEN_HELSB_CALLBACK_KEY:veriscreen-helsb-callback-change-me}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
